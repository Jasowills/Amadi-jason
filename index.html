<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Jason Amadi, Software Engineer</title>
    <meta
      name="description"
      content="Jason Amadi builds the plumbing other systems depend on: ingestion pipelines, platforms, and the infrastructure underneath."
    />
    <meta name="author" content="Jason Amadi" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Jason Amadi, Software Engineer" />
    <meta
      property="og:description"
      content="Jason Amadi builds the plumbing other systems depend on: ingestion pipelines, platforms, and the infrastructure underneath."
    />
    <meta property="og:url" content="https://amadi-jason.vercel.app/" />
    <meta property="og:site_name" content="Jason Amadi" />
    <meta property="og:image" content="https://amadi-jason.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Jason Amadi, Software Engineer" />
    <meta
      name="twitter:description"
      content="Jason Amadi builds the plumbing other systems depend on: ingestion pipelines, platforms, and the infrastructure underneath."
    />
    <meta name="twitter:image" content="https://amadi-jason.vercel.app/og-image.png" />

    <link rel="canonical" href="https://amadi-jason.vercel.app/" />

    <!-- theme-color: kept in sync with the resolved theme by the inline
         script below and by the header toggle -->
    <meta name="theme-color" content="#FFFFFF" />

    <!-- Favicon: ja monogram, theme aware inside the SVG -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Self hosted fonts, no third party requests -->
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/caveat-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/jetbrains-mono-400.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Resolve the theme before first paint, and send legacy-domain
         visits to the canonical host. No flash, no framework. -->
    <script>
      (function () {
        var LEGACY_HOSTS = ["amadijason.com", "www.amadijason.com"];
        var CANONICAL = "https://amadi-jason.vercel.app";
        var VISITED_KEY = "legacy_redirect_visited";

        try {
          var host = (window.location.hostname || "").toLowerCase();
          var path = window.location.pathname || "/";
          var query = window.location.search || "";
          var visited = false;
          try {
            visited = window.localStorage.getItem(VISITED_KEY) === "1";
          } catch (e) {
            visited = false;
          }
          if (LEGACY_HOSTS.indexOf(host) !== -1 || !visited) {
            try {
              window.localStorage.setItem(VISITED_KEY, "1");
            } catch (e) { /* storage unavailable; target is set regardless */ }
            window.location.replace(CANONICAL + path + query);
          }
        } catch (e) {
          /* legacy hosts must never break the page */
        }

        var resolved = "light";
        try {
          var stored = window.localStorage.getItem("theme");
          if (stored === "light" || stored === "dark") {
            resolved = stored;
          } else if (
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches
          ) {
            resolved = "dark";
          }
        } catch (e) {
          resolved = "light";
        }
        document.documentElement.setAttribute("data-theme", resolved);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", resolved === "dark" ? "#0F0F10" : "#FFFFFF");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

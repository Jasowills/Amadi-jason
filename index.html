    <meta property="twitter:card" content="summary_large_image" />

    <meta
      property="twitter:title"
      content="Amadi Jason - Professional Portfolio"
    />
    <meta
      property="twitter:description"
      content="Welcome to Amadi Jason's professional portfolio. Discover my work, skills, and experience in web development and design."
    />

    <meta property="twitter:creator" content="@amadijason" />

    <!-- Favicons -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <meta name="msapplication-TileColor" content="#0A0A0A" />

      name="theme-color"
      content="#F5F2ED"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"

    <!-- Prevent theme flash -->
    <script>
      if (localStorage.getItem("portfolio-theme") !== "light")
        document.documentElement.classList.add("dark");
      else document.documentElement.classList.remove("dark");

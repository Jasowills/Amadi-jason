<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="TIDE logo: a solid white location pin cut by three bars that narrow toward the point. Stacked, messy vehicle data normalized into one clean position.">
  <rect width="64" height="64" rx="14" fill="#0891B2"/>
  <!-- Pin silhouette: white, lake nose above, tip below. Spans y 10..54, so
       10 units of tile padding on every optical side (spec floor is 8). -->
  <path d="M32 54C32 54 16 40 16 26A16 16 0 0 1 48 26C48 40 32 54 32 54Z" fill="#FFFFFF"/>
  <!-- Three cutout bars, filled with the exact tile color (no opacity
       tricks). Widths 20, 14, 8, each centered on x 32, uniform 5 height
       with 4-unit gaps, sitting symmetrically around the pin's center of
       mass so the stack reads as layers being normalized to the point. -->
  <rect x="22" y="18" width="20" height="5" rx="2" fill="#0891B2"/>
  <rect x="25" y="27" width="14" height="5" rx="2" fill="#0891B2"/>
  <rect x="28" y="36" width="8" height="5" rx="2" fill="#0891B2"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="PRISM logo: four colored strands enter a faceted prism, bend inside it and leave as one white line">
  <rect width="64" height="64" rx="14" fill="#211F47"/>
  <!-- faceted body, lighter facet carries depth -->
  <polygon points="25,16 46,32 25,48" fill="#2E2B58"/>
  <polygon points="25,16 25,48" fill="#F2F0E9" fill-opacity="0.12"/>
  <polygon points="25,16 46,32 25,48" fill="none" stroke="#F2F0E9" stroke-opacity="0.22" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- strands refracting inside the glass, just as strong as outside -->
  <path d="M25,26.2 L46,32" stroke="#E3A857" stroke-width="2.3" stroke-linecap="round" fill="none"/>
  <path d="M25,29.9 L46,32" stroke="#D95F70" stroke-width="2.3" stroke-linecap="round" fill="none"/>
  <path d="M25,34.1 L46,32" stroke="#3FA796" stroke-width="2.3" stroke-linecap="round" fill="none"/>
  <path d="M25,37.8 L46,32" stroke="#6FA8DC" stroke-width="2.3" stroke-linecap="round" fill="none"/>
  <!-- four disagreeing signals in -->
  <path d="M8,21 L25,26.2" stroke="#E3A857" stroke-width="2.3" stroke-linecap="round" fill="none"/>
  <path d="M8,27.6 L25,29.9" stroke="#D95F70" stroke-width="2.3" stroke-linecap="round" fill="none"/>
  <path d="M8,36.4 L25,34.1" stroke="#3FA796" stroke-width="2.3" stroke-linecap="round" fill="none"/>
  <path d="M8,43 L25,37.8" stroke="#6FA8DC" stroke-width="2.3" stroke-linecap="round" fill="none"/>
  <!-- one verdict out -->
  <path d="M46,32 L57,32" stroke="#F2F0E9" stroke-width="2.6" stroke-linecap="round" fill="none"/>
</svg>
